name: build

# Собирает Windows-exe, портативный архив и macOS-бандл.
#
# Релиз выпускается двумя способами, оба прикрепляют файлы к релизу, откуда их
# забирает автообновление:
#   * тег v* — как раньше;
#   * коммит в любую ветку со словом [release] в сообщении — тег берётся из
#     __version__ в clipper/__init__.py. Так релиз можно выпустить без прав на
#     создание тегов, одним обычным пушем.
# Обычные коммиты без маркера сборку не запускают: она долгая и здесь не нужна.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

# Раннеры печатают в cp1252/cp437, а сообщения у нас на русском.
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  # Без токена анонимные запросы к api.github.com упираются в лимит.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  windows:
    if: >-
      github.event_name != 'push' || github.ref_type == 'tag'
      || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: ffmpeg и инструменты YouTube
        run: |
          python tools/fetch_ffmpeg.py
          python tools/fetch_youtube_tools.py

      - name: Иконка
        run: python tools/make_icon.py

      - name: Тесты интерфейса
        run: |
          python tools/test_cache.py
          python tools/test_i18n.py
          python tools/test_download_errors.py
          python tools/test_export_dir.py

      - name: Сборка exe
        run: pyinstaller --noconfirm Clipper.spec

      - name: Портативный архив
        run: python tools/make_portable.py

      - name: Проверка сборки
        run: |
          .\dist\Clipper.exe --selftest selftest.txt
          Start-Sleep -Seconds 20
          Get-Content selftest.txt
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Clipper.exe
            dist/Clipper-portable-win64.zip

  macos:
    if: >-
      github.event_name != 'push' || github.ref_type == 'tag'
      || contains(github.event.head_commit.message, '[release]')
    runs-on: macos-14          # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: ffmpeg и инструменты YouTube
        run: |
          python tools/fetch_ffmpeg.py
          python tools/fetch_youtube_tools.py

      - name: Иконки
        run: |
          python tools/make_icon.py
          python tools/make_icns.py

      - name: Тест самообновления
        run: python tools/test_self_update.py

      - name: Тест английского интерфейса
        run: python tools/test_i18n.py

      - name: Сборка Clipper.app
        run: pyinstaller --noconfirm Clipper-macos.spec

      - name: Ad-hoc подпись и архив
        run: |
          codesign --force --deep --sign - dist/Clipper.app || true
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Clipper.app Clipper-macos.zip

      - name: Проверка сборки
        run: |
          ./dist/Clipper.app/Contents/MacOS/Clipper --selftest selftest.txt || true
          sleep 20
          cat selftest.txt || echo "selftest не создан"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Clipper-macos.zip

  release:
    if: >-
      github.ref_type == 'tag'
      || (github.event_name == 'push'
          && contains(github.event.head_commit.message, '[release]'))
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия релиза
        id: version
        # По тегу берём его имя, по маркеру [release] — версию из кода:
        # __version__ и есть источник правды, руками её дублировать незачем.
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            version=$(python3 -c "import clipper; print(clipper.__version__)")
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Прикрепить файлы к релизу
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/windows/Clipper.exe
            artifacts/windows/Clipper-portable-win64.zip
            artifacts/macos/Clipper-macos.zip
